name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/hover.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp site/index.html site/styles.css site/app.js site/robots.txt site/sitemap.xml _site/
          cp assets/hover.png _site/assets/hover.png
          cp docs/screenshots/hover-calendar.png _site/assets/hover-calendar.png
          cp docs/screenshots/hover-island.png _site/assets/hover-island.png
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
