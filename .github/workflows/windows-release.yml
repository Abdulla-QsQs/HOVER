name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HOVER installer
        run: npm run dist:win

      - name: Generate checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "HOVER-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "HOVER installer was not created." }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          "$hash  $($installer.Name)" | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOVER-Windows-Installer
          path: |
            dist/HOVER-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter "HOVER-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "HOVER installer was not created." }
          $tag = "${{ github.ref_name }}"
          $assets = @($installer.FullName, (Resolve-Path "dist/SHA256SUMS.txt").Path)
          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag @assets --repo "${{ github.repository }}" --clobber
          } else {
            gh release create $tag @assets --repo "${{ github.repository }}" --generate-notes --title "HOVER $tag"
          }
