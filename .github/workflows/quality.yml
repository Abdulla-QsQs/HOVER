name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Install scheduler dependencies
        run: npm ci --prefix scheduler

      - name: Check JavaScript
        run: npm test

      - name: Build and test mobile companion
        run: |
          npm run build --prefix mobile
          npm run test:sites --prefix mobile

      - name: Test push scheduler
        run: |
          npm run check --prefix scheduler
          npm test --prefix scheduler

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix mobile --audit-level=high
          npm audit --prefix scheduler --audit-level=high
